name: Release
on:
  workflow_run:
    # zizmor: ignore[dangerous-triggers] Only successful pushes from this repository can publish releases.
    workflows: [Test]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Creates release tags for the tested commit.
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked] Release tags use the checkout credential.
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - uses: ./ # zizmor: ignore[self-repository] Runs the action from the tested checkout.
        id: version
        with:
          tag-prefix: "v"
      - name: Build stamped release asset
        env:
          ARTIFACT: ${{ runner.temp }}/gitcalver.sh
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed 's|^VERSION=""$|VERSION="'"$VERSION"'"|' \
            gitcalver.sh > "$ARTIFACT"
          chmod +x "$ARTIFACT"
          actual=$("$ARTIFACT" --version)
          [[ "$actual" == "gitcalver $VERSION" ]] || {
            echo "Stamp verification failed: $actual" >&2
            exit 1
          }
      - uses: ./ # zizmor: ignore[self-repository] Runs the action from the tested checkout.
        id: publish
        with:
          tag-prefix: "v"
          tag: "true"
      - name: Publish immutable release
        env:
          ARTIFACT: ${{ runner.temp }}/gitcalver.sh
          BUILT_TAG: ${{ steps.version.outputs.tag }}
          BUILT_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          [[ "$VERSION" == "$BUILT_VERSION" && "$TAG" == "$BUILT_TAG" ]] || {
            echo "Published version changed after the asset was built" >&2
            exit 1
          }

          verify_published() {
            local release state asset_names verify_dir
            release=$(gh release view "$TAG" --json isDraft,name,assets)
            state=$(jq -r '[.isDraft, .name] | @tsv' <<<"$release")
            [[ "$state" == $'false\t'"$VERSION" ]] || {
              echo "Release $TAG is not the expected published release: $state" >&2
              return 1
            }
            asset_names=$(jq -r '.assets[].name' <<<"$release")
            [[ "$asset_names" == gitcalver.sh ]] || {
              echo "Release $TAG has unexpected assets: $asset_names" >&2
              return 1
            }
            verify_dir=$(mktemp -d "${RUNNER_TEMP}/published-release.XXXXXX")
            gh release download "$TAG" --pattern gitcalver.sh --dir "$verify_dir"
            cmp "$ARTIFACT" "$verify_dir/gitcalver.sh"
          }

          if draft=$(gh release view "$TAG" --json isDraft \
            --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              verify_published
              echo "Release $TAG already exists and matches"
              exit 0
            fi
            [[ "$draft" == true ]] || {
              echo "Release $TAG returned an invalid draft state: $draft" >&2
              exit 1
            }
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$ARTIFACT" \
            --draft \
            --verify-tag \
            --title "$VERSION" \
            --notes "gitcalver.sh $VERSION"

          verify_dir="${RUNNER_TEMP}/release-verify"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --pattern gitcalver.sh --dir "$verify_dir"
          cmp "$ARTIFACT" "$verify_dir/gitcalver.sh"

          gh release edit "$TAG" \
            --draft=false \
            --latest
          verify_published
    name: release
